<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect - Cabine</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#C35627]">
<header class="w-full h-20 bg-[#ADCBBA] flex items-center px-4 shadow-md">
    <img src="pixels/logo.png" alt="Logo BusDirect" class="w-20 h-auto">
    <h1 class="text-2xl font-bold italic ml-5">BusDirect</h1>
</header>

<main class="p-4">
    <a href="index.html" class="inline-block bg-white font-bold rounded-xl px-5 py-2 mb-4 shadow-md hover:bg-[#CCDCDB] transition">← Trajets</a>

    <section id="infosTrajet" class="bg-[#CCDCDB] rounded-2xl p-5 mb-4 shadow-md text-center font-bold" aria-live="polite">
        Chargement...
    </section>

    <div id="contenuCabine" class="grid grid-cols-1 lg:grid-cols-2 gap-4">
        <section class="bg-[#D3C0B2] rounded-2xl p-5 shadow-md" aria-labelledby="titrePlan">
            <h2 id="titrePlan" class="text-2xl font-extrabold mb-3">Plan de la cabine</h2>
            <ul class="flex flex-wrap gap-4 mb-4 font-semibold">
                <li><span class="inline-block w-4 h-4 rounded bg-green-400 border"></span> Libre</li>
                <li><span class="inline-block w-4 h-4 rounded bg-amber-300 border"></span> VIP</li>
                <li><span class="inline-block w-4 h-4 rounded bg-red-500 border"></span> Occupé</li>
            </ul>
            <div id="planBus"></div>
        </section>

        <div class="flex flex-col gap-4">
            <section class="bg-white rounded-2xl p-5 shadow-md" aria-labelledby="titreReserver">
                <h2 id="titreReserver" class="text-xl font-bold mb-3">Réserver</h2>
                <form id="formReserver" novalidate>
                    <fieldset id="fieldsetReserver" class="flex flex-col gap-3">
                        <legend class="sr-only">Réserver une place</legend>
                        <div>
                            <label for="nomReserver" class="font-semibold">Nom du passager</label>
                            <input type="text" id="nomReserver" name="nom" class="border-2 rounded-xl p-3 w-full">
                            <p id="erreurNomReserver" class="text-red-600 text-sm"></p>
                        </div>
                        <div>
                            <label for="telReserver" class="font-semibold">Téléphone</label>
                            <input type="tel" id="telReserver" name="tel" placeholder="0612345678" class="border-2 rounded-xl p-3 w-full">
                            <p id="erreurTelReserver" class="text-red-600 text-sm"></p>
                        </div>
                        <div>
                            <label for="siegeReserver" class="font-semibold">Siège</label>
                            <select id="siegeReserver" name="siege" class="border-2 rounded-xl p-3 w-full">
                                <option value="">Premier siège libre</option>
                            </select>
                        </div>
                        <button type="submit" class="bg-[#C35627] text-white font-bold rounded-xl p-3 hover:bg-[#A94720] transition">Réserver</button>
                    </fieldset>
                </form>
                <p id="messageReserver" role="status" class="hidden"></p>
            </section>

            <section class="bg-white rounded-2xl p-5 shadow-md" aria-labelledby="titreModifier">
                <h2 id="titreModifier" class="text-xl font-bold mb-3">Modifier</h2>
                <form id="formModifier" novalidate class="flex flex-col gap-3">
                    <div>
                        <label for="passagerModifier" class="font-semibold">Passager</label>
                        <select id="passagerModifier" name="passager" class="border-2 rounded-xl p-3 w-full">
                            <option value="">Choisir un passager</option>
                        </select>
                    </div>
                    <div>
                        <label for="nomModifier" class="font-semibold">Nom</label>
                        <input type="text" id="nomModifier" name="nom" class="border-2 rounded-xl p-3 w-full">
                        <p id="erreurNomModifier" class="text-red-600 text-sm"></p>
                    </div>
                    <div>
                        <label for="telModifier" class="font-semibold">Téléphone</label>
                        <input type="tel" id="telModifier" name="tel" class="border-2 rounded-xl p-3 w-full">
                        <p id="erreurTelModifier" class="text-red-600 text-sm"></p>
                    </div>
                    <div>
                        <label for="siegeModifier" class="font-semibold">Siège</label>
                        <select id="siegeModifier" name="siege" class="border-2 rounded-xl p-3 w-full"></select>
                    </div>
                    <button type="submit" class="bg-orange-500 text-white font-bold rounded-xl p-3 hover:bg-orange-600 transition">Modifier</button>
                </form>
                <p id="messageModifier" role="status" class="hidden"></p>
            </section>

            <section class="bg-white rounded-2xl p-5 shadow-md" aria-labelledby="titreAnnuler">
                <h2 id="titreAnnuler" class="text-xl font-bold mb-3">Annuler</h2>
                <form id="formAnnuler" class="flex flex-col gap-3">
                    <div>
                        <label for="passagerAnnuler" class="font-semibold">Passager</label>
                        <select id="passagerAnnuler" name="passager" class="border-2 rounded-xl p-3 w-full">
                            <option value="">Choisir un passager</option>
                        </select>
                    </div>
                    <button type="submit" class="bg-red-600 text-white font-bold rounded-xl p-3 hover:bg-red-700 transition">Annuler la réservation</button>
                </form>
                <p id="messageAnnuler" role="status" class="hidden"></p>
            </section>

            <section class="bg-white rounded-2xl p-5 shadow-md" aria-labelledby="titreAttente">
                <h2 id="titreAttente" class="text-xl font-bold mb-3">Liste d'attente</h2>
                <form id="formAttente" novalidate>
                    <fieldset id="fieldsetAttente" class="flex flex-col gap-3" disabled>
                        <legend class="sr-only">S'inscrire sur la liste d'attente</legend>
                        <div>
                            <label for="nomAttente" class="font-semibold">Nom du passager</label>
                            <input type="text" id="nomAttente" name="nom" class="border-2 rounded-xl p-3 w-full">
                            <p id="erreurNomAttente" class="text-red-600 text-sm"></p>
                        </div>
                        <div>
                            <label for="telAttente" class="font-semibold">Téléphone</label>
                            <input type="tel" id="telAttente" name="tel" placeholder="0612345678" class="border-2 rounded-xl p-3 w-full">
                            <p id="erreurTelAttente" class="text-red-600 text-sm"></p>
                        </div>
                        <button type="submit" class="bg-[#ADCBBA] font-bold rounded-xl p-3 hover:bg-[#CCDCDB] transition">S'inscrire en attente</button>
                    </fieldset>
                </form>
                <ol id="listeAttente" class="mt-3 flex flex-col gap-2"></ol>
                <p id="messageAttente" role="status" class="hidden"></p>
            </section>
        </div>
    </div>
</main>

<script type="module" src="js/main-cabine.js"></script>
</body>
</html>
