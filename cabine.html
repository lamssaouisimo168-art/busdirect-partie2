<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusDirect - Cabine</title>
</head>
<body>
<header>
    <h1>La Cabine</h1>
</header>
<main>
    <div id="board">
        <div id="siege-1"></div>
        <div id="siege-2"></div>
        <div id="siege-3"></div>
        <div id="siege-4"></div>
        <div id="siege-5"></div>
        <div id="siege-6"></div>
        <div id="siege-7"></div>
        <div id="siege-8"></div>
        <div id="siege-9"></div>
        <div id="siege-10"></div>
        <div id="siege-11"></div>
        <div id="siege-12"></div>
        <div id="siege-13"></div>
        <div id="siege-14"></div>
        <div id="siege-15"></div>
        <div id="siege-16"></div>
        <div id="siege-17"></div>
        <div id="siege-18"></div>
        <div id="siege-19"></div>
        <div id="siege-20"></div>
    </div>
    <section>
    <h2>Réserver un siège</h2>

    <form id="reservation-form">
        <input
            type="text"
            id="name"
            placeholder="Nom du passager"
        >

        <select id="seat-number">
            <option value="">Choisir un siège</option>
        </select>

        <button type="submit">Réserver</button>
    </form>

    <p id="message"></p>
</section>
<section>
    <h2>Modifier une réservation</h2>

    <form id="edit-form">
        <input
            type="text"
            id="new-name"
            placeholder="Nouveau nom"
        >

        <select id="new-seat">
            <option value="">Choisir un siège</option>
        </select>

        <button type="submit">Modifier</button>
    </form>
</section>
</main>
</body>
</html>
