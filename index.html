<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>BusDirect</title>

</head>
<body class="bg-[#C35627]">
<header>
 <div class="w-full h-20 bg-[#ADCBBA] flex items-center px-4 shadow-md">
   
    <img src="pixels/logo.png" alt="logo" class="w-20 h-auto">
     <h1 class=" text-2xl font-bold italic flex items-center ml-5">BusDirect</h1>
   <div class="ml-auto flex items-center gap-3 mr-4">
    <select class="border rounded-lg p-2">
        <option value="compte">Compte</option>
        <option value="option">Option</option>
        <option value="deconnexion">Déconnexion</option>
    </select>
</div>
<img src="pixels/PFP.png" alt="pfp" class="w-12 h-auto pl-3">
 </div>

</header>
<section aria-labelledby="titre-trajets">
    <div class="bg-[#CCDCDB] flex flex-col md:flex-row justify-around items-center gap-4 p-6">
        <h2 id="titre-trajets" class="text-2xl font-black text-[#C35627]">
            Tous les trajets
        </h2>

        <div class="bg-white border border-[#ADCBBA] rounded-xl p-5 shadow-sm">
            <p class="font-bold">Recette : <span id="statRecette">0</span> DH</p>
        </div>
        <div class="bg-white border border-[#ADCBBA] rounded-xl p-5 shadow-sm">
            <p class="font-bold">Passagers : <span id="statPassagers">0</span></p>
        </div>
        <div class="bg-white border border-[#ADCBBA] rounded-xl p-5 shadow-sm">
            <p class="font-bold">Nombre de trajets : <span id="statTrajets">0</span></p>
        </div>
    </div>

    <div class="bg-[#CCDCDB] flex flex-col md:flex-row items-center justify-center gap-4 p-5 mx-4 rounded-2xl shadow-md">
        <div class="flex flex-col w-full max-w-xl gap-2">
            <label for="searchBar" class="text-xl font-bold text-[#C35627]">
                Rechercher votre trajet
            </label>
            <input
                type="search"
                id="searchBar"
                name="search"
                placeholder="Ville de départ ou d'arrivée..."
                class="border-2 border-[#ADCBBA] rounded-xl bg-white h-11 w-full px-4 outline-none focus:border-[#C35627] focus:ring-2 focus:ring-[#C35627]/20">
        </div>

        <div class="flex flex-col w-full md:w-auto gap-2">
            <label for="statut" class="text-xl font-bold text-[#C35627]">Statut</label>
            <select
                id="statut"
                name="statut"
                class="border-2 border-[#C35627] rounded-xl p-3 text-lg bg-white shadow-sm">
                <option value="tous">Tous</option>
                <option value="disponible">Disponible</option>
                <option value="complet">Complet</option>
            </select>
        </div>
    </div>

    <p id="aucunResultat" class="hidden text-center text-white font-bold p-4">
        Aucun trajet ne correspond
    </p>

    <div id="listeTrajets" class="w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 p-4"></div>

    <nav id="pagination" aria-label="Pagination des trajets" class="flex justify-center gap-3 p-4"></nav>
</section>



</section>

<script type="module" src="js/main-trajets.js"></script>
<script type="module" src="store.js"></script>
<script type="module" src="validation.js"></script>
<script type="module" src ="render.js"></script>
<script type="module" src="reservation.js"></script>
<script type="module"  src="main-trajets.js"></script>
<script  type="module" src="main-cabine.js"></script>
</body>
</html>
